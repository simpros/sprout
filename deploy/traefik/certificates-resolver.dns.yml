# Traefik static-config snippet: DNS-01 ACME for wildcard preview certs.
# Paste under your existing `certificatesResolvers:` map — do NOT replace
# Coolify/other managed static ACME config wholesale (that deletes HTTP-01).
#
# Placeholders:
#   <ACME_EMAIL>                 — Let's Encrypt contact email
#   <ACME_DNS_STORAGE_PATH>      — durable path for THIS resolver only
#                                  (e.g. /data/acme-dns.json). When adding a
#                                  second resolver alongside HTTP-01, MUST differ
#                                  from the HTTP-01 resolver's storage file —
#                                  Traefik allows one storage file per resolver.
#   <DNS_PROVIDER>               — Traefik dnsChallenge provider name for your DNS
#                                  (see Traefik "DNS Providers" docs; e.g. cloudflare,
#                                  route53, digitalocean — pick yours, do not guess)
#   <DNS_PROVIDER_ENV_*>         — provider-specific env vars Traefik expects
#                                  (API token / keys). Inject via Traefik container
#                                  env or a secrets store — never hard-code here.
#
# Prefer the default path in docs/deploy.md § Wildcard: convert the existing
# resolver to dnsChallenge (same name, same storage). Use this file only for
# the coexistence branch below.
#
# Coexistence — paste under certificatesResolvers: (HTTP-01 stays as-is):

  letsencrypt-dns:
    acme:
      email: "<ACME_EMAIL>"
      storage: "<ACME_DNS_STORAGE_PATH>"
      # Optional: caServer for staging while testing issuance:
      # caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: "<DNS_PROVIDER>"
        # delayBeforeCheck: 0   # raise if your DNS provider is slow to propagate
        # resolvers:
        #   - "1.1.1.1:53"
        #   - "8.8.8.8:53"
