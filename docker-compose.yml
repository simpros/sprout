# Operator smoke stack: Postgres + gateway + Traefik.
# See docs/deploy.md for wiring notes and external Traefik coexistence.
#
# Quick start:
#   cp compose.env.example compose.env   # edit secrets
#   docker compose --env-file compose.env up -d --build
#   curl -sf http://127.0.0.1:7331/healthz
#
# External Traefik/Postgres (Coolify, etc.):
#   docker compose -f docker-compose.yml -f docker-compose.external.yml \
#     --env-file compose.env up -d --build gateway

# Compose project name pins Docker volume identity (`sprout_*`).
# Upgrading from legacy preview-buddy* defaults: wipe volumes/networks and redeploy.
name: sprout

networks:
  traefik:
    name: ${SPROUT_TRAEFIK_NETWORK:-sprout-traefik}
  postgres:
    name: ${SPROUT_POSTGRES_NETWORK:-sprout-postgres}

volumes:
  gateway-data:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sprout_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in compose.env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sprout_admin} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    networks:
      - traefik
    ports:
      # Host port overridable for e2e (see e2e/compose.e2e.env).
      - "${TRAEFIK_HTTP_PORT:-8880}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO

  gateway:
    build: .
    restart: unless-stopped
    networks:
      - traefik
      - postgres
    ports:
      # Host port overridable for e2e (see e2e/compose.e2e.env).
      - "${SPROUT_GATEWAY_HOST_PORT:-7331}:7331"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPROUT_PREVIEW_POSTGRES_URL: ${SPROUT_PREVIEW_POSTGRES_URL:?set SPROUT_PREVIEW_POSTGRES_URL in compose.env}
      SPROUT_PG_HOST: ${SPROUT_PG_HOST:-postgres}
      SPROUT_PG_PORT: ${SPROUT_PG_PORT:-5432}
      SPROUT_PG_USER: ${SPROUT_PG_USER:-sprout_preview}
      SPROUT_PG_PASSWORD: ${SPROUT_PG_PASSWORD:?set SPROUT_PG_PASSWORD in compose.env}
      SPROUT_TRAEFIK_NETWORK: ${SPROUT_TRAEFIK_NETWORK:-sprout-traefik}
      SPROUT_POSTGRES_NETWORK: ${SPROUT_POSTGRES_NETWORK:-sprout-postgres}
      SPROUT_TRAEFIK_ENTRYPOINTS: ${SPROUT_TRAEFIK_ENTRYPOINTS:-}
      SPROUT_TRAEFIK_CERTRESOLVER: ${SPROUT_TRAEFIK_CERTRESOLVER:-}
      SPROUT_TRAEFIK_MIDDLEWARES: ${SPROUT_TRAEFIK_MIDDLEWARES:-}
      SPROUT_FORWARDAUTH_ADDRESS: ${SPROUT_FORWARDAUTH_ADDRESS:-}
      SPROUT_REGISTRY_USER: ${SPROUT_REGISTRY_USER:-}
      SPROUT_REGISTRY_PASSWORD: ${SPROUT_REGISTRY_PASSWORD:-}
      SPROUT_REGISTRY_AUTHS_JSON: ${SPROUT_REGISTRY_AUTHS_JSON:-}
      SPROUT_GITHUB_TOKEN: ${SPROUT_GITHUB_TOKEN:-}
      SPROUT_GITLAB_TOKEN: ${SPROUT_GITLAB_TOKEN:-}
      SPROUT_FORGE_HOSTS: ${SPROUT_FORGE_HOSTS:-}
      # Blank/unset → loadConfig treats as undefined → auto-generate
      SPROUT_ADMIN_TOKEN: ${SPROUT_ADMIN_TOKEN:-}
      SPROUT_STATE_DB_PATH: ${SPROUT_STATE_DB_PATH:-/data/sprout.db}
      # Published path for in-container CLI fallback (do not derive from DB path in CLI)
      SPROUT_ADMIN_TOKEN_PATH: ${SPROUT_ADMIN_TOKEN_PATH:-/data/admin-token}
      SPROUT_PORT: "7331"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:7331/healthz'); process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
