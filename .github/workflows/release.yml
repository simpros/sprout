name: release

# release.published alone has produced zero runs (re-publish of an already-
# published release fires `edited`, not `published`). Tag push covers first-
# time releases; workflow_dispatch rebuilds an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve release tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$REF_NAME}"
          if [ -z "$tag" ]; then
            echo "Could not resolve release tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Derive image tags
        id: tags
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          version="$VERSION"
          # Semver prerelease / build metadata: do not move :latest
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          tags="ghcr.io/simpros/sprout:${version}"
          if [ "$prerelease" != "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/simpros/sprout:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SPROUT_VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}

  cli:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Compile CLI binary
        env:
          SPROUT_CLI_VERSION: ${{ needs.meta.outputs.tag }}
        run: bun run --filter @sprout/cli compile
      # Host is glibc; the musl binary needs Alpine (+ libstdc++, which Bun's
      # musl embed still links dynamically on 1.4.x).
      - name: Smoke-test on musl (Alpine)
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          docker run --rm \
            -v "$PWD/dist/sprout-linux-x64:/sprout:ro" \
            alpine:3.20 \
            sh -c 'apk add --no-cache libstdc++ >/dev/null && test "$(/sprout --version)" = "'"$TAG"'"'
      - name: Upload sprout-linux-x64 to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "sprout ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" dist/sprout-linux-x64 --clobber
