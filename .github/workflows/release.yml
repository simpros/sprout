name: release

# Re-publishing a release fires edited, not published — tag push and dispatch cover it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve release tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$REF_NAME}"
          if [ -z "$tag" ]; then
            echo "Could not resolve release tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Derive image tags
        id: tags
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          version="$VERSION"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          tags="ghcr.io/simpros/sprout:${version}"
          if [ "$prerelease" != "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/simpros/sprout:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SPROUT_VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}

  cli:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Compile CLI binaries
        env:
          SPROUT_CLI_VERSION: ${{ needs.meta.outputs.tag }}
        run: bun run --filter @sprout/cli compile
      - name: Smoke-test on glibc (host)
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: test "$(./dist/sprout-linux-x64 --version)" = "$TAG"
      - name: Smoke-test on musl (Alpine)
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          docker run --rm \
            -v "$PWD/dist/sprout-linux-x64-musl:/sprout:ro" \
            alpine:3.20 \
            sh -c 'apk add --no-cache libstdc++ >/dev/null && test "$(/sprout --version)" = "'"$TAG"'"'
      - name: Publish checksums
        run: |
          (cd dist && sha256sum sprout-linux-x64 sprout-linux-x64-musl > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Upload CLI binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "sprout ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" \
            dist/sprout-linux-x64 \
            dist/sprout-linux-x64-musl \
            dist/SHA256SUMS.txt \
            --clobber

  component:
    needs: [meta, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Sync templates to GitLab component project
        env:
          SPROUT_COMPONENT_PROJECT: ${{ vars.SPROUT_COMPONENT_PROJECT }}
          SPROUT_GITLAB_HOST: ${{ vars.SPROUT_GITLAB_HOST }}
          SPROUT_GITLAB_SYNC_TOKEN: ${{ secrets.SPROUT_GITLAB_SYNC_TOKEN }}
          VERSION_TAG: ${{ needs.meta.outputs.tag }}
        run: bash scripts/sync-gitlab-component.sh
