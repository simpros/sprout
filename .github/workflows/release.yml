name: release

# release.published alone has produced zero runs (re-publish of an already-
# published release fires `edited`, not `published`). Tag push + manual
# dispatch are the reliable paths; keep published for first-time releases.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve image version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT_NAME" in
            release)
              tag="$RELEASE_TAG"
              prerelease="$RELEASE_PRERELEASE"
              ;;
            workflow_dispatch)
              tag="$DISPATCH_TAG"
              prerelease=false
              ;;
            push)
              tag="$REF_NAME"
              prerelease=false
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [ -z "$tag" ]; then
            echo "Could not resolve release tag" >&2
            exit 1
          fi

          version="${tag#v}"
          # Semver prerelease / build metadata: do not move :latest
          if [ "$prerelease" != "true" ] && [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags="ghcr.io/simpros/sprout:${version}"
          if [ "$prerelease" != "true" ]; then
            tags="${tags}"$'\n'"ghcr.io/simpros/sprout:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SPROUT_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.ver.outputs.tags }}
