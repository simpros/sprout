name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Acceptance stays non-blocking until compose smoke is confirmed in CI.
  acceptance:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: E2E acceptance harness
        run: bun run test:e2e
