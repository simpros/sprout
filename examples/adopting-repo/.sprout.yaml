slug: demoapp
preview:
  hostname: "pr-{pr_id}.demoapp.preview.example.com"
health:
  path: /health
  interval: 2s
  timeout: 120s
  expect: 200
seed:
  dockerfile: Dockerfile.seed
  # Reuse key: every COPY source in Dockerfile.seed. Without `inputs` the
  # seed image is rebuilt on every run (commit-scoped tag); with them the
  # build is skipped while the content-addressed tag exists in the registry.
  inputs:
    - Dockerfile.seed
    - package.json
    - scripts/seed.ts
    - docker-seed-entrypoint.sh
